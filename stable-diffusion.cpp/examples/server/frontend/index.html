<!doctype html>
<html lang="en" data-theme="dracula">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23BD93F9'/%3E%3Cstop offset='1' stop-color='%23FF79C6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='%23282A36'/%3E%3Ctext x='32' y='41' fill='url(%23g)' font-family='Segoe UI, Arial, sans-serif' font-size='28' font-weight='800' letter-spacing='-1' text-anchor='middle'%3ESD%3C/text%3E%3C/svg%3E" />
    <title>stable-diffusion.cpp WebUI</title>
    <script>
        // Apply the saved theme and language before first paint (avoids a light flash).
        try {
            var savedTheme = JSON.parse(localStorage.getItem("sdcpp-webui-theme") || "null");
            if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
            var savedLocale = JSON.parse(localStorage.getItem("sdcpp-webui-locale") || "null");
            if (savedLocale) document.documentElement.setAttribute("lang", savedLocale);
        } catch (e) {}
    </script>
    <style>
        html, body { background: #1e1f29; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
